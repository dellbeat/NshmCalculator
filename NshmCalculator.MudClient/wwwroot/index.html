<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一款集合了网络上部分计算手游属性数值的在线计算器，方便手机端的小伙伴使用。目前拥有身份收益、PVE收益和治疗收益计算功能，对齐网易运营的2.3.2版本">
    <title>逆水寒手游计算器-集合部分手游属性数值计算的在线计算器</title>
    <style>
        #loading-tip {
            position: absolute;
            text-align: center;
            font-weight: bold;
            inset: calc(25vh + 9.5rem) 0 auto 0.2rem;
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;    /* 垂直居中 */
        }
        #refresh-button:hover {
            background-color: #0056b3;
        }
        h1 {
            display: none;
        }
    </style>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css?v=1.2.1" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="NshmCalculator.MudClient.styles.css" rel="stylesheet" />
    <link href="css/roboto.css" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script defer src="js/visitor.js?v=20250122" data-website-id="6d90845e-d69f-4392-866c-009e6987c125" data-host-url="https://us.umami.is"></script>
</head>

<body>
    <div id="app">
        <h1>逆水寒手游计算器</h1>
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
        <div class="loading-watting-text">如首次加载，可能需要等待10~20秒</div>
        <div id="loading-tip" hidden="true">
            页面还未显示？可点击<button onclick="location.reload()" id="refresh-button" class="refresh-button">刷新</button>更新缓存。
        </div>
    </div>

    <div id="blazor-error-ui">
        加载出现错误，可能是浏览器版本过低。
        <p/>
        请使用Chrome大于等于95/Safari大于等于16.4的版本，感谢理解~
        <p/>
        如确认版本满足条件，可联系开发者，也可以尝试
        <a href="" class="reload">重新加载</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        setTimeout(function() {
            var element = document.getElementById('loading-tip');

            if (element) {
                if (element.hidden) {
                    // 通过 hidden 属性设置为显示状态
                    element.hidden = false;
                } else {
                    // 通过 hidden 属性设置为隐藏状态
                    element.hidden = true;
                }
            }
        }, 15000); // 设置5秒后显示提示
    </script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script type="module">
        import { BrotliDecode } from '/js/decode.min.js';
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                // 注意：这里使用localhost的时候不会启动压缩
                if (type !== 'dotnetjs' && location.hostname !== 'localhost' && type !== 'configuration') {
                    return (async function () {
                        const response = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                        if (!response.ok) {
                            throw new Error(response.statusText);
                        }
                        const originalResponseBuffer = await response.arrayBuffer();
                        const originalResponseArray = new Int8Array(originalResponseBuffer);
                        const decompressedResponseArray = BrotliDecode(originalResponseArray);
                        const contentType = type ===
                            'dotnetwasm' ? 'application/wasm' : 'application/octet-stream';
                        return new Response(decompressedResponseArray,
                            { headers: { 'content-type': contentType } });
                    })();
                }
            }
        });
    </script>
</body>

</html>
