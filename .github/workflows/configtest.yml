# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: 'configCheck'

on:
  push:
  pull_request:
    branches: [ pve_3.4 ]
    paths:
      - '**.cs'
      - '**.csproj'
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

env:
  DOTNET_VERSION: '8.0.404' # The .NET SDK version to use

jobs:
  build-and-test:

    name: build-and-test-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-restore --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Report
        uses: actions/upload-artifact@v4  # upload test results
        if: success() || failure()        # run this step even if previous step failed
        with:
          name: config-results
          path: ${{ github.workspace }}/**/TestResults/**/*

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.16.1
        if: always()
        with:
          trx_files: "${{ github.workspace }}/**/TestResults/**/*.trx"
  
  report:
    if: ${{ !cancelled() }}
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: dorny/test-reporter@v1
        with:
          artifact: config-results            # artifact name
          name: test-results                  # Name of the check run which will be created
          path: "**/TestResults/*.trx"                    # Path to test results (inside artifact .zip)
          reporter: dotnet-trx              # Format of test results